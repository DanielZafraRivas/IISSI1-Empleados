xt><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="114.7383" x="198" y="563.9043">fechaInicio</text><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="92.0508" x="198" y="591.502">fechaFin</text><text fill="#222222" font-family="Arial" font-size="24" font-weight="bold" lengthAdjust="spacing" textLength="56.0156" x="296.7188" y="591.502">[0..1]</text><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="70.6992" x="198" y="619.0996">salario</text><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="94.6992" x="198" y="646.6973">comisi&#243;n</text></g><!--class Categor?a--><g id="elem_Categor&#237;a"><rect codeLine="54" fill="#FFFF00" height="173.9883" id="Categor&#237;a" rx="5" ry="5" style="stroke:#9F1732;stroke-width:1.0;" width="178.7109" x="356" y="112.1973"/><text fill="#6D6D6D" font-family="Arial" font-size="24" font-style="italic" lengthAdjust="spacing" textLength="96.0703" x="397.3203" y="144.709">&#171;Nuevo&#187;</text><text fill="#222222" font-family="Arial" font-size="24" font-weight="bold" lengthAdjust="spacing" textLength="110.6953" x="390.0078" y="172.3066">Categor&#237;a</text><line style="stroke:#9F1732;stroke-width:1.0;" x1="358" x2="532.7109" y1="187.3926" y2="187.3926"/><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="81.375" x="368" y="217.9043">nombre</text><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="149.3789" x="368" y="245.502">salarioM&#237;nimo</text><text fill="#222222" font-family="Arial" font-size="24" lengthAdjust="spacing" textLength="154.7109" x="368" y="273.0996">salarioM&#225;ximo</text></g><g id="elem_RN"><path d="M695,86.1973 L695,313.1797 L1211.7168,313.1797 L1211.7168,106.1973 L1191.7168,86.1973 L695,86.1973 " fill="#E0E7EC" style="stroke:#9F1732;stroke-width:1.0;"/><path d="M1191.7168,86.1973 L1191.7168,106.1973 L1211.7168,106.1973 L1191.7168,86.1973 " fill="#E0E7EC" style="stroke:#9F1732;stroke-width:2.0;"/><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="474.7168" x="707" y="114.957">- RN01: El nombre del empleado no se puede repetir.</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="369.1211" x="707" y="137.9551">- RN02: Un departamento no puede tener</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="226.7871" x="751.4531" y="160.9531">m&#225;s de cinco empleados.</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="387.9785" x="707" y="183.9512">- RN03: La combinaci&#243;n nombre y localidad</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="177.9004" x="751.4531" y="206.9492">no se puede repetir.</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="441.377" x="707" y="229.9473">- RN04: Un empleado no puede ser su propio jefe</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="324.5996" x="707" y="252.9453">- RN05: La comisi&#243;n est&#225; entre 0 y 1</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="381.3086" x="707" y="275.9434">- RN06: La comisi&#243;n no puede cambiar (20</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="380.2539" x="751.4531" y="298.9414">puntos porcentuales) en una actualizaci&#243;n.</text></g><g id="elem_RA"><path d="M1371,109.1973 L1371,290.1836 L1822.1309,290.1836 L1822.1309,129.1973 L1802.1309,109.1973 L1371,109.1973 " fill="#FFDD99" style="stroke:#9F1732;stroke-width:1.0;"/><path d="M1802.1309,109.1973 L1802.1309,129.1973 L1822.1309,129.1973 L1802.1309,109.1973 " fill="#FFDD99" style="stroke:#9F1732;stroke-width:2.0;"/><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="204.5605" x="1383" y="137.957">Requisitos adicionales:</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="290.166" x="1405.2266" y="160.9551">RA01: El nombre de la categor&#237;a</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="172.3438" x="1405.2266" y="183.9531">no se puede repetir</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="370.1953" x="1405.2266" y="206.9512">RA02: El salario m&#237;nimo de una categor&#237;a</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="307.9102" x="1405.2266" y="229.9492">es positivo y menor que el m&#225;ximo</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="386.9043" x="1405.2266" y="252.9473">RA03: El salario de un empleado est&#225; entre</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="342.3633" x="1405.2266" y="275.9453">el m&#237;nimo y el m&#225;ximo de su categor&#237;a</text></g><!--link Departamento to Empleado--><g id="link_Departamento_Empleado"><path codeLine="60" d="M114.34,258.7173 C123.78,316.8573 137,398.1973 137,398.1973 C137,398.1973 160.66,425.4573 188.38,457.3973 " fill="none" id="Departamento-Empleado" style="stroke:#8C0000;stroke-width:2.0;"/><polygon fill="#222222" points="142.2064,378.1999,142.8538,393.403,151.6663,390.119,142.2064,378.1999" style="stroke:#222222;stroke-width:2.0;"/><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="85.6152" x="159" y="392.957">trabajaEn</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textLength="33.3594" x="81.0244" y="293.8085">0..1</text><text fill="#222222" font-family="Arial" font-size="20" lengthAdjust="spacing" textL